[project]
name = "urban-economics-replication"
version = "0.2.0"
description = "Modular framework for replicating urban economics research on housing constraints and spatial misallocation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Data handling
    "pandas>=2.3.3",
    "numpy>=1.24",
    "openpyxl>=3.1.5",
    
    # Geographic data
    "geopandas>=1.0.1",
    "shapely>=2.0.0",
    
    # HTTP/downloads
    "requests>=2.32.0",
    
    # Visualization
    "matplotlib>=3.10.7",
    
    # Jupyter
    "ipykernel>=6.29.5",
    "ipython>=8.30.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.2",
    
    # Math/stats (for spatial equilibrium model)
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=4.1",
    "ruff>=0.14.10",
    "mypy>=1.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F401"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
